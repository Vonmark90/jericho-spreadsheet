[package]
name = "jericho_spreadsheet"
version = "0.2.0"
edition = "2024"
authors = ["Jericho Spreadsheet Team"]
description = "Fast, lightweight, professional spreadsheet application with native Excel compatibility"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
calamine = { version = "0.36", features = ["chrono", "dates"] }
rust_xlsxwriter = { version = "0.99", features = ["chrono"] }
csv = "1.4"
rfd = "0.17"
arboard = "3.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
