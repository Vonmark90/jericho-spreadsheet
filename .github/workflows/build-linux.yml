name: Build Linux Packages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  build-linux:
    name: Build & Package (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            dpkg-dev

      - name: Run Test Suite
        run: cargo test --release --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Linux Tarball and Debian Package
        run: |
          chmod +x scripts/*.sh
          scripts/build_linux_package.sh
          scripts/build_deb.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jericho-spreadsheet-linux-x86_64
          path: target/dist/*.*

      - name: Attach to Release (if release trigger)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} target/dist/*.tar.gz target/dist/*.deb --clobber
